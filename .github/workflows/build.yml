name: Build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/SnipFlow.csproj -c Release -f net10.0-windows10.0.19041.0 --nologo
      - name: Annotation regression
        run: dotnet run --project tests/ImageCrop.Regression -c Release -- --output verification/image-crop/ci
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/SnipFlow.csproj -c Release -f net10.0 --nologo
      - name: Annotation regression (virtual display)
        run: xvfb-run -a dotnet run --project tests/ImageCrop.Regression -c Release -- --output verification/image-crop/ci
      - name: Package (deb and portable archive)
        run: ./build-linux.sh 0.0.0 --skip-appimage
