name: Package release draft
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver version, for example 0.2.1
        required: true
        type: string
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Package Windows x64
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./build-release.ps1 -Version $env:RELEASE_VERSION
      - name: Create reviewable release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          $assets = Get-ChildItem release/packages -File | Where-Object { $_.Extension -in '.exe','.nupkg','.json' } | Select-Object -ExpandProperty FullName
          gh release create "v$env:RELEASE_VERSION" @assets --draft --target "$env:GITHUB_SHA" --title "SnipFlow $env:RELEASE_VERSION" --notes "Windows x64 安裝版。發布這個草稿後，已安裝的 SnipFlow 才會收到新版本。"
          if ($LASTEXITCODE -ne 0) { throw 'Release draft creation failed.' }
